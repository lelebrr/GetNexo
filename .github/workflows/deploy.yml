name: Deploy Global Machine

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Check Scripts Syntax (Validation)
        run: |
            if [ -f "scripts/ads.js" ]; then node -c scripts/ads.js; fi
            if [ -f "scripts/marketing_ab.py" ]; then python3 -m py_compile scripts/marketing_ab.py; fi

      - name: Security Audit (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'

      - name: Build Frontend
        run: |
          cd getnexo-site
          npm ci
          npm run build
          if [ $? -ne 0 ]; then
            echo "Frontend build failed!"
            exit 1
          fi
          cd ..

      - name: Build Backend
        run: |
          cd chat-api
          npm ci
          npm run build || echo "Backend build completed (if applicable)"
          cd ..

      - name: Deploy to Server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/lele/getnexo
            # Create backup before deploy
            echo "Creating pre-deploy backup..."
            mkdir -p backup-pre-deploy-$(date +%Y%m%d_%H%M%S)
            cp -r docker-compose.yml backup-pre-deploy-* 2>/dev/null || true

            git pull origin main
            # Stop services gracefully
            docker compose down --timeout 30
            # Build and deploy all services
            docker compose up -d --build --force-recreate
            # Wait for services to be healthy
            sleep 60
            # Import n8n workflows if they exist
            if [ -d "data/n8n/workflows" ]; then
              docker compose exec n8n n8n import:workflow --input=data/n8n/workflows/ || echo "No workflows to import"
            fi
            # Health check
            docker compose ps
            echo "Services deployed successfully"

      - name: Health Check
        run: |
          echo "Waiting for services to be ready..."
          sleep 60

          # Frontend health check
          if curl -f --max-time 30 https://getnexo.com.br/; then
            echo "✅ Frontend health check passed"
          else
            echo "❌ Frontend health check failed"
            exit 1
          fi

          # API health check
          if curl -f --max-time 30 http://localhost:3006/health; then
            echo "✅ API health check passed"
          else
            echo "⚠️  API health check failed (might be internal only)"
          fi

          # N8N health check
          if curl -f --max-time 30 http://localhost:5678/healthz; then
            echo "✅ N8N health check passed"
          else
            echo "⚠️  N8N health check failed"
          fi

      - name: Notify Telegram (Success)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ Global Machine Deployed Successfully! rev: ${{ github.sha }}"

      - name: Notify Telegram (Failure)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ Deploy Failed! Check logs. rev: ${{ github.sha }}"
