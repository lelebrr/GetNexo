apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: n8n-autoscale
  namespace: getnexo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n8n
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  # Custom Metric: AI Token Throughput
  # - type: Pods
  #   pods:
  #     metric:
  #       name: ai_tokens_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: 50
