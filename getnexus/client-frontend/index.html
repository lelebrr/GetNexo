<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Meu Uso GetNexo</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 40px; background: #f9f9f9; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 15px 0; }
    .warn { border: 2px solid #ffcc00; color: #d35400; }
    button { padding: 10px 16px; background: #00bfff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    iframe { width: 100%; height: 400px; border: none; border-radius: 8px; }
    .login-box { max-width: 400px; margin: 0 auto; }
    input { display: block; width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;}
  </style>
</head>
<body>
  <h1>Olá, <span id="nomeLoja">Visitante</span>! Veja seu uso</h1>

  <!-- Simple Login UI for testing -->
  <div id="loginSection" class="card login-box">
      <h3>Login</h3>
      <input type="email" id="email" placeholder="Email" value="teste@loja.com">
      <input type="password" id="password" placeholder="Senha" value="123456">
      <button onclick="fazerLogin()">Entrar</button>
      <button onclick="registrar()">Criar Conta Teste</button>
  </div>

  <div id="dashboardSection" style="display:none;">
      <div class="card">
        <h3>Uso do Bot</h3>
        <p><strong>Memória:</strong> <span id="memoria">Carregando...</span></p>
        <p><strong>Mensagens/hora:</strong> <span id="msgs">0</span></p>
        <p><strong>Status:</strong> <span id="status">iniciando...</span></p>
      </div>

      <div class="card warn" id="alerta" style="display:none;">
        <strong>⚠️ Atenção:</strong> Seu bot está usando <span id="extra">0</span> MB a mais que o básico. Vai cobrar R$ <span id="valorExtra">0,00</span>.
      </div>

      <button onclick="abrirChat()">Falar com o Bot</button>

      <iframe id="chatframe" style="display:none;"></iframe>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
