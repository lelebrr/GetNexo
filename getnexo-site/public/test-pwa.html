<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste PWA Install Modal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #030712;
            color: white;
            padding: 20px;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #00d4ff, #00ff9d);
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 50px;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <h1>Teste da Modal PWA</h1>
    <p>Clique no botão abaixo para testar a nova modal de instalação PWA</p>
    <button onclick="testPWAModal()">Mostrar Modal PWA</button>

    <script src="/custom/js/pwa-install.js"></script>
    <script>
        function testPWAModal() {
            // Forçar a exibição da modal para teste
            if (window.PWAInstallPrompt) {
                window.PWAInstallPrompt.prototype.showInstallPrompt.call(new PWAInstallPrompt());
            } else {
                // Criar uma instância e chamar diretamente
                const pwaPrompt = new PWAInstallPrompt();
                pwaPrompt.showInstallPrompt();
            }
        }
    </script>
</body>

</html>
