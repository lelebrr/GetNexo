# /etc/sysctl.conf - GetNexo Security & Performance Hardening
# Apply with: sudo sysctl -p

# Security: Kernel Poiter Restrictions
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.randomize_va_space=2

# Security: Network Hardening
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.tcp_syncookies=1
net.ipv4.conf.all.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0

# Security: Filesystem Protected Links
fs.protected_regular=2
fs.protected_fifos=2

# Performance: Transparent Huge Pages (Hybrid Tuning)
# Note: Set 'madvise' via /sys/kernel/mm/transparent_hugepage/enabled script
vm.swappiness=5
vm.vfs_cache_pressure=50

# Performance: Network Tuning
net.core.somaxconn=4096
net.ipv4.tcp_window_scaling=1
