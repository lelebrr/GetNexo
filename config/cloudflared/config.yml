# Usando tunnel existente que estava funcionando
tunnel: d3f3dd2f-6e4d-45e5-a182-aa36cc8db06c
credentials-file: /root/.cloudflared/cert.pem
origincert: /root/.cloudflared/cert.pem

ingress:
  # 1. Frontend (Landing Page) - PRODUCTION MODE
  - hostname: getnexo.com.br
    service: http://nginx:80

  # 2. Chatwoot / Widget Host - PRODUCTION MODE
  - hostname: chat.getnexo.com.br
    service: http://frontend:4321

  # 3. Evolution API / OmniNexo Backend
  - hostname: api.getnexo.com.br
    service: http://backend:3006
    originRequest:
      httpHostHeader: api.getnexo.com.br
      noTLSVerify: true

  # 4. Admin Panel (Frontend Route) - PRODUCTION MODE
  - hostname: admin.getnexo.com.br
    service: http://nginx:80

  # 5. N8N
  - hostname: n8n.getnexo.com.br
    service: http://n8n:5678

  # Catch-all
  - service: http_status:404

loglevel: info
