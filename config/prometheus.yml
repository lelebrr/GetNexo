global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'getnexo-stack'
    static_configs:
      - targets: ['traefik:8080', 'node-exporter:9100', 'cadvisor:8080']
  
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
