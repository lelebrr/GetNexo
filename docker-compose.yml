version: '3.8'

networks:
  getnexo_network:
    driver: bridge

services:
  # Frontend - Site Astro
  frontend:
    env_file:
      - .env
    image: getnexo/frontend:latest
    build:
      context: ./getnexo-site
      dockerfile: Dockerfile
    ports:
      - "3000:4321" # Mantém acesso externo para desenvolvimento
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4321/pt/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - getnexo_network

  # Backend - API Node.js
  backend:
    env_file:
      - .env
    image: getnexo/backend:latest
    build:
      context: ./chat-api
      dockerfile: Dockerfile
    ports:
      - "3006:3006" # Mantém acesso externo para APIs
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DB_PATH=/data/omninchat.db
    volumes:
      - ./logs:/logs
      - ./data/chat-api:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - getnexo_network

  # N8N - Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678" # Mantém acesso externo para administração
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-getnexo.com.br}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - DB_TYPE=postgres
      - DB_POSTGRES_HOST=db
      - DB_POSTGRES_PORT=5432
      - DB_POSTGRES_DB=n8n
      - DB_POSTGRES_USER=${DB_USER:-n8n}
      - DB_POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - getnexo_network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-n8n}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=evolution_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-n8n}" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - getnexo_network

  # Redis Cache
  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - getnexo_network

  # Evolution API - WhatsApp
  evolution:
    image: atendai/evolution-api:v2.1.1
    ports:
      - "3002:8080" # Mantém acesso externo para WhatsApp API
    env_file:
      - .env
    environment:
      - SERVER_URL=http://localhost:3002
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - CONFIG_SESSION_PHONE_CLIENT=EvolutionAPI
      - CONFIG_SESSION_PHONE_NAME=getnexo
      - DIALECT=postgres
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/evolution_api
      - DATABASE_PROVIDER=postgresql
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_DATABASE=evolution_api
      - DATABASE_SSL=false
      - DATABASE_SYNC=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
      - LOG_COLOR=true
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true
      - CLEAN_STORE_CLEANING_INTERVAL=7200000
      - CLEAN_STORE_MESSAGES=true
      - CLEAN_STORE_MESSAGE_DAYS=90
      - CLEAN_STORE_CHATS=true
      - CLEAN_STORE_CHATS_DAYS=90
      - CLEAN_STORE_CONTACTS=true
      - CLEAN_STORE_CONTACTS_DAYS=90
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - evolution_data:/evolution/store
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - getnexo_network

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./config/cloudflared:/etc/cloudflared:ro
      - ~/.cloudflared:/root/.cloudflared:ro
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - getnexo_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - n8n
    networks:
      - getnexo_network

  # MongoDB - For AI Models & Analytics
  mongodb:
    image: mongo:6.0
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - getnexo_network

volumes:
  postgres_data:
  redis_data:
  evolution_data:
  n8n_data:
  mongodb_data:
