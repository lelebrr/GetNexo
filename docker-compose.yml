version: '3.8'
services:
  bot:
    image: getnexo/app:latest
    ports:
      - "8080:80"  # WhatsApp webhooks aqui
    environment:
      - MODE=escala_auto
      - CONVERSAS_LIMITE=100  # por hora
      - RAM_BASE=1g
      - CPU_BASE=1.0
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - /logs/conversas:/logs/conversas
      - /sessions:/sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Opcional: banco interno
  db:
    image: sqlite  # ou postgres:alpine se crescer
    volumes:
      - /var/db/getnexo:/data
